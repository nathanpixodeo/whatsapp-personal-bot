# Reference reverse-proxy config for the WhatsApp relay.
#
# Only needed if an upstream service must reach /send from another host. If the
# caller runs on the same box, skip nginx entirely and let it talk to
# 127.0.0.1:3000 directly - fewer moving parts, nothing exposed.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/whatsapp-relay
#   sudo ln -s /etc/nginx/sites-available/whatsapp-relay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get the certificate first: sudo certbot --nginx -d relay.example.com

# Rate limit at the edge too. The app's own limiter is per API key; this one is per
# IP and cheap enough to absorb a flood before Node ever sees it.
limit_req_zone $binary_remote_addr zone=relay:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    # ACME challenges must stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # An API key in a query string ends up in this log. The relay only reads the
    # X-API-Key header, so keep it that way.
    access_log /var/log/nginx/whatsapp-relay.access.log;
    error_log  /var/log/nginx/whatsapp-relay.error.log;

    client_max_body_size 64k;

    # SECURITY: /qr returns a pairing code that links a *new device* to the WhatsApp
    # account. Anyone who scans it can read and send messages as that account, and the
    # API key alone is not a strong enough control for that. Never proxy it.
    # Reach it over an SSH tunnel instead:
    #   ssh -L 3000:127.0.0.1:3000 user@host   then open http://localhost:3000/qr
    location = /qr {
        deny all;
        return 404;
    }

    # Same reasoning for the pairing-code endpoint and the test console that drives it.
    # The app also refuses /ui and / for non-loopback callers, so this is the second lock.
    location = /pair { deny all; return 404; }
    location = /ui   { deny all; return 404; }
    # Swagger UI. Its "Try it out" reaches /qr and /pair, so it is a takeover surface
    # rather than documentation. Prefix match, since the plugin serves static assets
    # under /docs/ too.
    location ^~ /docs { deny all; return 404; }
    location = /     { deny all; return 404; }

    # Unauthenticated on purpose so an external monitor can poll it. It leaks only
    # connection state, never message content. Drop this block to close it off.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        # Allowlist the callers. Replace with the real source addresses; an open relay
        # protected by one shared key is one leaked key away from spam sent as a real
        # person - and from that number being banned.
        allow 203.0.113.10;   # upstream webhook sender
        allow 127.0.0.1;
        deny  all;

        limit_req zone=relay burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app sets trustProxy, so this is what its rate limiter and logs key on.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A send waits behind the pacing queue, so allow more than the default 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
