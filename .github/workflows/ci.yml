name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.9 is the floor: the npm scripts use --env-file-if-exists.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # tsc over src/ and scripts/. No test suite yet - see CONTRIBUTING.md.
      - run: npm run typecheck

      - run: npm run build

  audit:
    name: npm audit (advisory only)
    runs-on: ubuntu-latest
    # baileys is pinned to an exact prerelease on purpose, so an advisory here is a
    # signal to review rather than a reason to fail the build.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high
